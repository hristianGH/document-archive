# UI e2e stack with its own database. The e2e container runs the tests once the web is up; the rest stays running.
name: document-archive-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: e2e
    ports:
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      timeout: 5s
      retries: 10

  archive:
    build:
      context: .
      dockerfile: src/Archive/Archive.Api/Dockerfile
    environment:
      ConnectionStrings__Archive: Host=postgres;Database=archive;Username=archive;Password=e2e
    volumes:
      - files:/data/files
    ports:
      - "18081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  export:
    build:
      context: .
      dockerfile: src/Export/Export.Api/Dockerfile
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      archive:
        condition: service_healthy

  web:
    build:
      context: src/web
    ports:
      - "18080:8080"
    depends_on:
      export:
        condition: service_healthy

  e2e:
    build:
      context: src/web
      dockerfile: e2e/Dockerfile
    environment:
      E2E_BASE_URL: http://web:8080
    ipc: host
    volumes:
      - ./src/web/playwright-report:/web/playwright-report
      - ./src/web/test-results:/web/test-results
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  files: